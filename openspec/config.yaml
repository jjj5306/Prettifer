schema: spec-driven

context: |
  Prettifer는 Git 그래프에서 커밋을 선택하고 선택된 변경의 최종 결과를
  이해하기 쉽게 탐색하는 도구다.
  초기 단계에서는 사용자가 관찰하는 코어 동작과 UX를 먼저 정의한다.
  내부 결과 모델, 공개 API, CLI와 배포 구조는 명시적으로 요청된 변경에서 다룬다.
  선택 가능성을 넓게 유지하고, 가능한 결과를 우선 제공하며, 부분 결과와
  문제 원인을 명확하게 안내한다.

rules:
  proposal:
    - 제품 문제, 사용자 가치, 범위와 영향을 중심으로 작성한다.
    - 구현 구조와 내부 데이터 모델을 포함하지 않는다.
  specs:
    - 한국어와 사용자가 이해할 수 있는 표현을 사용한다.
    - 사용자가 관찰할 수 있고 검증 가능한 동작을 시나리오로 작성한다.
    - 오류 상황에는 가능한 결과, 문제 범위와 사용자 안내를 포함한다.
  design:
    - 확정된 운영 원칙과 설계 결정만 기록한다.
    - 구현 기술이 확정되지 않은 영역은 사용자 계약과 검증 기준만 기록한다.
  tasks:
    - 각 작업은 완료 여부를 검증할 수 있는 크기로 작성한다.
