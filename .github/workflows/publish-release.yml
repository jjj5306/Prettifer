name: Publish release

# Publishes the Windows build to the public distribution repository.
# Triggered by pushing a version tag (for example `v0.1.1`) or manually.
#
# Requires a repository secret named RELEASE_REPO_TOKEN: a fine-grained personal
# access token with Contents: read and write on jjj5306/prettifer-release.
# The default GITHUB_TOKEN cannot write to another repository.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, for example v0.1.1"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: jjj5306/prettifer-release

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      # Node 24 ships the npm major that wrote package-lock.json. An older npm
      # resolves the optional wasm dependencies differently and fails npm ci.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Resolve the release tag
        id: release
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') {
            throw "The tag '$tag' is not a vMAJOR.MINOR.PATCH version."
          }
          $version = $tag.TrimStart('v')
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            throw "The tag version '$version' does not match package.json '$packageVersion'."
          }
          "tag=$tag" | Add-Content $env:GITHUB_OUTPUT
          "version=$version" | Add-Content $env:GITHUB_OUTPUT

      # Before spending minutes on a build that cannot be published.
      - name: Check the changelog for this version
        run: node scripts/changelog-section.mjs ${{ steps.release.outputs.version }}

      - name: Install dependencies
        run: npm ci

      # One verification command per step. The default shell on a Windows runner
      # is pwsh, where only the last command of a run block decides the step
      # exit code, so grouping these would publish a release despite a failing
      # lint or type check.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the Windows ZIP
        run: npm run desktop:make

      - name: Collect the release assets
        id: assets
        shell: pwsh
        run: |
          $zipDirectory = 'out/desktop/make/zip/win32/x64'
          $zip = Get-ChildItem $zipDirectory -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $zip) {
            throw "No ZIP was produced in $zipDirectory."
          }
          $staging = 'release-assets'
          New-Item -ItemType Directory -Force $staging | Out-Null
          $assetName = "prettifer-win32-x64-${{ steps.release.outputs.version }}.zip"
          Copy-Item $zip.FullName (Join-Path $staging $assetName)
          $hash = (Get-FileHash (Join-Path $staging $assetName) -Algorithm SHA256).Hash.ToLower()
          "$hash  $assetName" | Set-Content (Join-Path $staging 'SHA256SUMS.txt') -Encoding utf8NoBOM
          "sha256=$hash" | Add-Content $env:GITHUB_OUTPUT
          "directory=$staging" | Add-Content $env:GITHUB_OUTPUT

      # One renderer for the workflow and for re-rendering an old release, so a
      # note published later cannot drift from what this job would have written.
      - name: Write the release notes
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          OUT: release-notes.md
        run: node scripts/release-notes.mjs

      - name: Publish to the distribution repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw "RELEASE_REPO_TOKEN is not set. Add it as a repository secret."
          }
          $tag = '${{ steps.release.outputs.tag }}'
          $repository = '${{ env.RELEASE_REPOSITORY }}'
          $assets = Get-ChildItem '${{ steps.assets.outputs.directory }}' -File |
            Select-Object -ExpandProperty FullName
          $draft = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.draft }}' -eq 'true'
          } else {
            $false
          }

          $existing = gh release view $tag --repo $repository 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Updating the existing $tag release."
            gh release edit $tag --repo $repository `
              --title "Prettifer $tag" --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "Updating the release failed." }
            gh release upload $tag @assets --repo $repository --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading the assets failed." }
          } else {
            Write-Host "Creating the $tag release."
            $arguments = @(
              'release', 'create', $tag
              '--repo', $repository
              '--title', "Prettifer $tag"
              '--notes-file', 'release-notes.md'
            )
            if ($draft) { $arguments += '--draft' }
            gh @arguments @assets
            if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }
          }

      - name: Report the published release
        shell: pwsh
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          "Published https://github.com/${{ env.RELEASE_REPOSITORY }}/releases/tag/$tag" |
            Add-Content $env:GITHUB_STEP_SUMMARY
