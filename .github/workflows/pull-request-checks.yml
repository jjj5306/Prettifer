name: Pull request checks

# Runs the machine-checkable part of the merge gate in AGENTS.md section 7 on
# every pull request into main and on main itself. Requirement matching, issue
# scope and documentation consistency stay with the pull request self-review.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

# Only the newest commit of a branch needs a verdict.
concurrency:
  group: pull-request-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types and unit tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      # Node 24 ships the npm major that wrote package-lock.json. An older npm
      # resolves the optional wasm dependencies differently and fails npm ci.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One verification command per step. The default shell on a Windows runner
      # is pwsh, where only the last command of a run block decides the step
      # exit code, so grouping these would hide an earlier failure.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # --no refuses to fetch from the registry, so this fails loudly if the
      # pinned CLI is ever dropped instead of silently running the unrelated
      # package that npm publishes under the bare name "openspec".
      - name: Validate OpenSpec
        run: npx --no -- openspec validate --all --strict

      # Fails only on advisories outside security/audit-allowlist.json, so the
      # result keeps meaning something while a known one waits on upstream.
      - name: Security advisories
        run: npm run audit:check

      # Covers the renderer, main-process and integration suites.
      - name: Unit tests
        run: npm test

  desktop-e2e:
    name: Electron end-to-end tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out the source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Packages the app, then drives the packaged Electron binary. Playwright's
      # bundled browsers are never launched, so they are not downloaded.
      - name: Electron end-to-end tests
        run: npm run test:desktop:e2e

      # Traces and screenshots of the failing run, so the cause can be read
      # without reproducing it locally.
      - name: Upload the end-to-end results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
